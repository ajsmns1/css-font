<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>마켓컬리 카드</title>
    <style>
      * {
        margin: 0;
      }
      .card {
        width: 200px;
        padding: 5px;
      }
      .img-box img {
        width: 100%;
        border-radius: 3px;
        display: block;
      }
      .cart {
        width: 100%;
        height: 30px;
        background-color: #fff;
        border: 1px solid #ccc;
        border-radius: 3px;
        color: #333;
        font-size: 13px;
        margin: 5px 0;
      }
      #product-name {
        font-size: 13px;
        margin-top: 3px;
      }
      .price-box {
        line-height: 1.3;
      }
      #original-price {
        font-size: 11px;
        color: #aaa;
        text-decoration: line-through;
        margin-top: 8px;
      }
      #discount {
        color: tomato;
        font-weight: bold;
      }
      #price {
        font-size: 13px;
        font-weight: bold;
      }
      #comment {
        font-size: 10px;
        color: #aaa;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="img-box">
        <img src="malcom.jpg" alt="바디워시" />
      </div>
      <button class="cart">
        <i class="fa-solid fa-cart-shopping"></i> 담기
      </button>
      <div class="desc-box">
        <p id="product-name">
          [말콤] 퍼퓸 모이스트필 바디워시 1000ml 2종 (택1)
        </p>
        <div class="price-box">
          <p id="original-price">32,000원</p>
          <p id="price">
            <span id="discount">59%</span>
            <span id="current-price">12,900원</span>
          </p>
        </div>
        <p id="comment"><i class="fa-solid fa-comment-dots"></i> 9,999+</p>
      </div>
    </div>
  </body>
</html>

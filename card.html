<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }
      .card {
        width: 300px;
        box-shadow: rgba(60, 64, 67, 0.16) 0px 2px 6px 0px;
        border-radius: 10%;
        overflow: hidden;
      }
      .img-box {
        width: 100%;
      }
      .img-box img {
        width: 100%;
        border-radius: 10% 10% 0 0;
        display: block;
      }
      .content {
        height: 100px;

        background-color: pink;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="img-box">
        <img src="logo.png" alt="애플 로고" />
      </div>
      <div class="content">
        <p>
          Lorem ipsum dolor, sit amet consectetur adipisicing elit. Perspiciatis
          rem, dolore voluptas aut ab incidunt tempore vero beatae, sit expedita
          cum debitis rerum nobis praesentium quaerat! Unde tempore eaque
          molestiae?
        </p>
      </div>
    </div>
  </body>
</html>
